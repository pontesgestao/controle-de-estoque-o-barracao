<!doctype html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel DRE · O Barracão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --laranja: #C01012; --laranja-escuro: #8F0A0C; --laranja-claro: #FBE1E1;
    --azul: #1C1C1C; --azul-claro: #ECECEC;
    --loja1: #C01012; --loja2: #1F6FB2;
    --fundo: #FFF6F5; --cartao: #FFFFFF; --texto: #1E1515; --suave: #6E5B5A; --borda: #EFDCDB;
    --verde: #1F8A4C; --verde-claro: #E2F4E9; --erro: #B42318; --erro-claro: #FDECEA; --aviso-claro: #FFF4D6;
    --raio: 16px; --sombra: 0 1px 2px rgba(60,0,0,.06), 0 4px 16px rgba(60,0,0,.06);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 15px/1.45 'Nunito', system-ui, sans-serif; }
  h1, h2, h3 { font-family: 'Fredoka', 'Nunito', sans-serif; font-weight: 600; margin: 0; line-height: 1.2; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  header.topo { background: var(--laranja); color: #fff; padding: 12px 16px 0; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 12px rgba(120,0,0,.25); }
  .topo-linha { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .topo img { height: 40px; background: #fff; border-radius: 8px; padding: 2px 6px; }
  .topo h1 { font-size: 1.3rem; }
  .topo .sub { opacity: .9; font-size: .85rem; margin-left: auto; text-align: right; }
  nav.abas { max-width: 1180px; margin: 10px auto 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  nav.abas button { border: 0; background: transparent; color: #fff; opacity: .85; padding: 10px 14px; font-weight: 800; border-radius: 10px 10px 0 0; white-space: nowrap; }
  nav.abas button[aria-selected="true"] { background: var(--fundo); color: var(--laranja-escuro); opacity: 1; }

  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
  .cartao { background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); padding: 18px; margin-bottom: 16px; }
  .cartao > h2 { font-size: 1.15rem; color: var(--azul); margin-bottom: 12px; }
  .linha-titulo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .linha-titulo h2 { font-size: 1.15rem; color: var(--azul); }
  .dica { color: var(--suave); font-size: .88rem; margin: 0 0 12px; }
  .vazio { text-align: center; color: var(--suave); padding: 28px 12px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 16px; border-radius: 12px; border: 0; font-weight: 800; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn-primario { background: var(--laranja); color: #fff; box-shadow: 0 3px 0 var(--laranja-escuro); }
  .btn-azul { background: var(--azul); color: #fff; box-shadow: 0 3px 0 #000000; }
  .btn-secundario { background: var(--azul-claro); color: var(--azul); }
  .btn-texto { background: none; color: var(--azul); text-decoration: underline; min-height: 32px; padding: 0 6px; }
  .btn-perigo { background: none; color: var(--erro); min-height: 32px; padding: 0 6px; text-decoration: underline; }
  .segmentado { display: inline-flex; background: #fff; border: 2px solid var(--borda); border-radius: 12px; padding: 3px; gap: 3px; flex-wrap: wrap; }
  .segmentado button { border: 0; background: none; padding: 7px 14px; border-radius: 9px; font-weight: 800; color: var(--suave); }
  .segmentado button[aria-pressed="true"] { background: var(--laranja); color: #fff; }

  label.campo { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: .88rem; }
  input[type=text], input[type=number], input[type=date], input[type=password], input[type=search], select {
    min-height: 42px; padding: 8px 10px; border: 2px solid var(--borda); border-radius: 10px; background: #fff; outline: none; width: 100%;
  }
  input:focus, select:focus { border-color: var(--laranja); }
  .grade-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--cartao); border-radius: 14px; box-shadow: var(--sombra); padding: 14px 16px; }
  .kpi .rotulo { font-size: .8rem; font-weight: 800; color: var(--suave); text-transform: uppercase; letter-spacing: .03em; }
  .kpi .valor { font-family: 'Fredoka', sans-serif; font-size: 1.7rem; font-weight: 600; margin-top: 2px; }
  .kpi .detalhe { font-size: .82rem; color: var(--suave); }
  .kpi.destaque { background: var(--azul); color: #fff; }
  .kpi.destaque .rotulo, .kpi.destaque .detalhe { color: #DADADA; }
  .equacao { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 800; }
  .equacao .bloco { background: var(--fundo); border-radius: 10px; padding: 8px 12px; text-align: center; }
  .equacao .bloco small { display: block; font-weight: 700; color: var(--suave); font-size: .75rem; }
  .equacao .op { color: var(--suave); font-size: 1.2rem; }

  /* Tabelas */
  .tabela-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th { text-align: left; font-size: .76rem; text-transform: uppercase; letter-spacing: .03em; color: var(--suave); padding: 8px; border-bottom: 2px solid var(--borda); white-space: nowrap; }
  td { padding: 8px; border-bottom: 1px solid var(--borda); vertical-align: middle; }
  td.r, th.r { text-align: right; }
  tr.clicavel { cursor: pointer; }
  tr.clicavel:hover td { background: #FFF8F8; }
  tr.selecionado td { background: var(--laranja-claro) !important; }
  .neg { color: var(--erro); font-weight: 800; }
  .tag { display: inline-block; font-size: .72rem; font-weight: 800; padding: 1px 8px; border-radius: 99px; background: var(--azul-claro); color: var(--azul); white-space: nowrap; }
  .tag.alerta { background: var(--aviso-claro); color: #8A5A00; }
  .tag.erro { background: var(--erro-claro); color: var(--erro); }
  .tag.ok { background: var(--verde-claro); color: var(--verde); }
  input.fat { width: 140px; text-align: right; min-height: 36px; }

  .alertas { display: flex; flex-direction: column; gap: 8px; }
  .alerta { border-radius: 12px; padding: 10px 14px; background: var(--aviso-claro); color: #6B4500; font-size: .9rem; }
  .alerta.erro { background: var(--erro-claro); color: var(--erro); }
  .alerta strong { display: block; }

  .graficos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .grafico { position: relative; height: 280px; }
  .grafico.alto { height: 340px; }

  /* Compras */
  .fotos { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 14px; }
  .fotos .arquivo { position: relative; }
  .fotos img { height: 90px; border-radius: 10px; border: 2px solid var(--borda); display: block; }
  .fotos .pdf { height: 90px; min-width: 90px; max-width: 180px; padding: 10px; border-radius: 10px; border: 2px solid var(--borda); background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: .75rem; font-weight: 700; color: var(--suave); text-align: center; word-break: break-all; }
  .fotos .pdf strong { font-size: 1rem; color: var(--erro); }
  .fotos .remover { position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--texto); color: #fff; font-weight: 800; line-height: 1; }
  .itens-nota td { padding: 6px 4px; }
  .itens-nota input, .itens-nota select { min-height: 36px; padding: 4px 8px; }
  .itens-nota tr.revisar td { background: #FFFBEA; }
  .itens-nota tr.fora td { background: #F6F3F3; }
  .itens-nota .desc { font-size: .8rem; color: var(--suave); max-width: 220px; }
  .botoes-arquivo { display: flex; gap: 10px; flex-wrap: wrap; }
  .botoes-arquivo .btn { width: max-content; }
  .cartao.salva { border: 2px solid var(--verde); background: var(--verde-claro); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .cartao.salva p { margin: 0; }
  /* Contas a pagar */
  .resumo-contas { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .resumo-contas .kpi.vencida { border-left: 5px solid var(--erro); }
  .resumo-contas .kpi.hoje { border-left: 5px solid #E07B00; }
  .resumo-contas .kpi.semana { border-left: 5px solid #E0B000; }
  .lista-contas { display: flex; flex-direction: column; gap: 10px; }
  .conta { border: 1px solid var(--borda); border-left: 5px solid var(--borda); border-radius: 12px; padding: 12px 14px; background: var(--cartao);
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; }
  .conta.vencida { border-left-color: var(--erro); background: var(--erro-claro); }
  .conta.hoje { border-left-color: #E07B00; background: #FFF1E0; }
  .conta.semana { border-left-color: #E0B000; }
  .conta.paga { opacity: .7; }
  .conta .data { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 1.15rem; text-align: center; line-height: 1.05; min-width: 54px; }
  .conta .data small { display: block; font-family: 'Nunito', sans-serif; font-size: .7rem; font-weight: 800; text-transform: uppercase; color: var(--suave); }
  .conta.vencida .data small { color: var(--erro); }
  .conta.hoje .data small { color: #A65A00; }
  .conta .quem { min-width: 0; }
  .conta .quem strong { display: block; overflow-wrap: anywhere; }
  .conta .quem span { color: var(--suave); font-size: .85rem; }
  .conta .valor { font-weight: 800; font-size: 1.05rem; text-align: right; white-space: nowrap; }
  .conta .linha-dig { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; min-width: 0; }
  .conta .linha-dig input { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; min-height: 36px; padding: 4px 8px; flex: 1; min-width: 0; }
  .conta .acoes-conta { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .boleto-form { border: 1px solid var(--borda); border-radius: 12px; padding: 12px; margin-bottom: 10px; position: relative; }
  .boleto-form.revisar { border-left: 5px solid #E0B000; }
  .boleto-form .grade-form { margin-bottom: 0; }
  .boleto-form .remover-boleto { position: absolute; top: 6px; right: 8px; }
  .telegram-passos { margin: 0 0 12px; padding-left: 20px; color: var(--suave); font-size: .9rem; }
  .telegram-passos li { margin-bottom: 4px; }
  .rodape-nota { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
  .carregando { display: inline-block; width: 16px; height: 16px; border: 3px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%; animation: gira .8s linear infinite; }
  .carregando.escuro { border-color: rgba(39,51,147,.2); border-top-color: var(--azul); }
  @keyframes gira { to { transform: rotate(360deg); } }
  .dialogo { border: 0; border-radius: var(--raio); padding: 22px; width: min(460px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .dialogo::backdrop { background: rgba(42,26,18,.45); }
  .dialogo form { display: flex; flex-direction: column; gap: 12px; }
  .dialogo h2 { color: var(--azul); font-size: 1.2rem; }
  .dialogo .dica { margin: 0; }
  .dialogo .alerta { margin: 0; font-size: .85rem; }
  .botoes-dialogo { display: flex; flex-direction: row-reverse; justify-content: flex-start; gap: 8px; }
  [hidden] { display: none !important; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--texto); color: #fff; padding: 10px 18px; border-radius: 12px; font-weight: 700; z-index: 50; box-shadow: var(--sombra); }
  .toast.erro { background: var(--erro); }

  @media (max-width: 760px) {
    .graficos { grid-template-columns: minmax(0, 1fr); }
    /* Compras no celular: botão de câmera grande, itens da nota em cartões
       e rodapé fixo com o total e o botão de salvar. */
    .botoes-arquivo .btn { width: 100%; justify-content: center; }
    .btn-camera { min-height: 56px; font-size: 1.1rem; }
    .cartao.salva .btn { width: 100%; }
    .itens-nota thead { display: none; }
    .itens-nota, .itens-nota tbody, .itens-nota tr, .itens-nota td { display: block; width: 100%; }
    .itens-nota tr { position: relative; border: 1px solid var(--borda); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: var(--cartao); }
    .itens-nota tr.revisar { border-left: 5px solid #E0B000; }
    .itens-nota tr.revisar td, .itens-nota tr.fora td { background: transparent; }
    .itens-nota tr.fora { background: #F6F3F3; }
    .itens-nota td { padding: 4px 0; border: 0; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .itens-nota td::before { content: attr(data-rot); font-size: .78rem; font-weight: 700; color: var(--suave); flex: none; max-width: 45%; }
    .itens-nota td[data-rot="Item da nota"], .itens-nota td[data-rot="Produto do estoque"] { display: block; padding-right: 40px; }
    .itens-nota td[data-rot="Item da nota"]::before, .itens-nota td[data-rot="Produto do estoque"]::before { display: block; margin-bottom: 2px; max-width: none; }
    .itens-nota td[data-rot="Item da nota"] input, .itens-nota td select { width: 100%; }
    .itens-nota .desc { max-width: none; }
    .itens-nota td input.num { width: 110px !important; }
    .itens-nota td.acao-item { position: absolute; top: 8px; right: 8px; width: auto; padding: 0; }
    .itens-nota td.acao-item::before { content: none; }
    .itens-nota td.acao-item .btn { min-height: 32px; padding: 0 10px; }
    .rodape-nota { position: sticky; bottom: 0; z-index: 4; background: var(--cartao); margin: 14px -18px -18px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-radius: 0 0 var(--raio) var(--raio); border-top: 1px solid var(--borda); box-shadow: 0 -4px 12px rgba(0,0,0,.06); }
    .rodape-nota .btn { width: 100%; min-height: 50px; }
    .conta { grid-template-columns: auto minmax(0, 1fr); }
    .conta .valor { grid-column: 2; text-align: left; }
    .conta .acoes-conta .btn { flex: 1; }
    .topo .sub { display: none; }
    .kpi .valor { font-size: 1.4rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="topo">
  <div class="topo-linha">
    <img src="https://pontesgestao.github.io/controle-de-estoque-o-barracao/img/logo.png" alt="O Barracão">
    <h1>Painel DRE</h1>
    <div class="sub" id="sub-topo"></div>
  </div>
  <nav class="abas" role="tablist">
    <button role="tab" data-aba="resultado">Resultado</button>
    <button role="tab" data-aba="compras">Compras</button>
    <button role="tab" data-aba="contas">Contas</button>
    <button role="tab" data-aba="custos">Custos</button>
    <button role="tab" data-aba="contagens">Contagens</button>
    <button role="tab" data-aba="config">Configurações</button>
  </nav>
</header>
<main id="conteudo"><div class="vazio"><span class="carregando escuro"></span> Carregando…</div></main>

<script>
// Bloco separado: mostra na tela qualquer erro da página, inclusive um erro
// que impeça o código principal (abaixo) de rodar.
window.addEventListener('error', function (e) {
  var m = document.getElementById('conteudo');
  if (m) m.insertAdjacentHTML('afterbegin', '<div class="alerta erro" style="margin-bottom:16px"><strong>Erro na tela do painel</strong>' +
    String(e.message || e.error || 'erro').replace(/[<>&]/g, '') + ' (linha ' + (e.lineno || '?') + '). Mande um print disto.</div>');
});
window.__painelIniciou = false;
setTimeout(function () {
  if (window.__painelIniciou) return;
  var m = document.getElementById('conteudo');
  if (m) m.insertAdjacentHTML('afterbegin', '<div class="alerta erro" style="margin-bottom:16px"><strong>A tela do painel não iniciou</strong>' +
    'O código da tela não rodou neste navegador (' + navigator.userAgent.replace(/[<>&]/g, '') + '). Mande um print disto.</div>');
}, 4000);
</script>
